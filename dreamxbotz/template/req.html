<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineHubPro Streaming Banner</title>
    <!-- Include FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* CSS Variables for Theme Colors */
        :root {
            --bg-dark: #050505;
            --red-primary: #e50914;
            --red-dark: #8b0000;
            --gold: #ffd700;
            --blue-glow: #00d2ff;
            --text-silver: linear-gradient(to bottom, #ffffff, #a0a5b1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
        }

        /* Main Banner Container */
        .banner-container {
            position: relative;
            width: 100%;
            max-width: 1200px;
            background: radial-gradient(ellipse at top, #131b2f 0%, #000000 70%);
            padding: 40px 20px;
            border-bottom: 2px solid var(--red-primary);
            overflow: hidden;
            text-align: center;
            box-shadow: 0 10px 30px rgba(229, 9, 20, 0.2);
        }

        /* Background Movie Grid Effect (Subtle) */
        .banner-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.9)),
                url('https://www.transparenttextures.com/patterns/cubes.png');
            opacity: 0.3;
            z-index: 1;
        }

        .content-wrapper {
            position: relative;
            z-index: 2;
        }

        /* Blue Neon Arc Behind Logo */
        .neon-arc {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 400px;
            height: 150px;
            border-top: 4px solid var(--blue-glow);
            border-radius: 50% 50% 0 0 / 100% 100% 0 0;
            box-shadow: 0 -15px 30px rgba(0, 210, 255, 0.4);
            z-index: -1;
        }

        /* Top Logo Section */
        .logo-section {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 10px;
            position: relative;
        }

        /* 3D Clapperboard & Crown styling */
        .clapper-icon, .crown-icon {
            font-size: 3rem;
            filter: drop-shadow(0 5px 10px rgba(0,0,0,0.8));
        }
        .clapper-icon { color: var(--red-primary); }
        .crown-icon { 
            color: var(--gold); 
            position: absolute;
            top: -25px;
            right: 28%;
            font-size: 2.5rem;
            transform: rotate(15deg);
        }

        /* CineHubPro Text Styling */
        .logo-text {
            font-size: 5rem;
            font-weight: 900;
            letter-spacing: -2px;
            text-transform: none;
            display: flex;
            align-items: center;
            filter: drop-shadow(0px 8px 5px rgba(0,0,0,0.8));
        }

        .text-cinehub {
            background: var(--text-silver);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-style: italic;
        }

        .text-pro {
            background: linear-gradient(to bottom, #ff4b4b, #990000);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            position: relative;
        }

        .text-pro::after {
            content: '\f144'; /* FontAwesome Play icon */
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            position: absolute;
            font-size: 1.5rem;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            -webkit-text-fill-color: white;
        }

        /* Subtitle: STREAMING */
        .subtitle {
            display: inline-block;
            background: linear-gradient(90deg, var(--red-dark), var(--red-primary), var(--red-dark));
            padding: 8px 30px;
            border-radius: 50px;
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 6px;
            box-shadow: 0 5px 15px rgba(229, 9, 20, 0.5);
            margin-bottom: 30px;
        }
        
        .subtitle i { margin-right: 10px; }
        .subtitle span { opacity: 0.7; letter-spacing: 2px; }

        /* Categories Line */
        .categories {
            list-style: none;
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .categories li {
            position: relative;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .categories li:hover { color: var(--red-primary); }

        .categories li:not(:last-child)::after {
            content: '|';
            position: absolute;
            right: -12px;
            color: var(--red-primary);
            opacity: 0.6;
        }

        /* Features Footer Line */
        .features {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            background: rgba(20, 20, 20, 0.8);
            border: 1px solid rgba(229, 9, 20, 0.3);
            border-radius: 30px;
            padding: 10px 30px;
            font-size: 0.95rem;
            font-weight: 500;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .feature-item:not(:last-child) {
            border-right: 1px solid rgba(255,255,255,0.2);
            padding-right: 25px;
        }

        /* Specific Icon Colors in Features */
        .hd-badge {
            background: linear-gradient(to right, #e50914, #8b0000);
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 900;
            font-size: 0.8rem;
            font-style: italic;
        }
        .fa-bolt { color: var(--gold); }
        .fa-globe { color: #cccccc; }
        .fa-lock-open { color: var(--gold); }

        /* Responsive Design */
        @media (max-width: 768px) {
            .logo-text { font-size: 3.5rem; }
            .neon-arc { width: 300px; height: 100px; }
            .crown-icon { right: 15%; top: -15px; font-size: 1.8rem; }
            .clapper-icon { font-size: 2rem; }
            .subtitle { font-size: 1rem; }
            .categories { flex-wrap: wrap; font-size: 1rem; }
            .features { flex-direction: column; border-radius: 15px; gap: 15px; padding: 20px;}
            .feature-item:not(:last-child) { border-right: none; border-bottom: 1px solid rgba(255,255,255,0.2); padding-right: 0; padding-bottom: 10px; width: 100%; justify-content: center;}
        }
    </style>
</head>
<body>

    <div class="banner-container">
        <div class="content-wrapper">
            
            <!-- Blue Glowing Arc -->
            <div class="neon-arc"></div>

            <!-- Logo Area -->
            <div class="logo-section">
                <i class="fa-solid fa-clapperboard clapper-icon"></i>
                <h1 class="logo-text">
                    <span class="text-cinehub">CineHub</span>
                    <span class="text-pro">Pro</span>
                </h1>
                <i class="fa-solid fa-crown crown-icon"></i>
            </div>

            <!-- Streaming Subtitle -->
            <div class="subtitle">
                <i class="fa-solid fa-play"></i> STREAMING <span>///</span>
            </div>

            <!-- Navigation / Categories -->
            <ul class="categories">
                <li>Watch Movies</li>
                <li>Web Series</li>
                <li>TV Shows</li>
                <li>Anime</li>
            </ul>

            <!-- Features Bar -->
            <div class="features">
                <div class="feature-item">
                    <span class="hd-badge">HD</span> Streaming
                </div>
                <div class="feature-item">
                    <i class="fa-solid fa-bolt"></i> Fast Play
                </div>
                <div class="feature-item">
                    <i class="fa-solid fa-globe"></i> Multi Language
                </div>
                <div class="feature-item">
                    <i class="fa-solid fa-lock-open"></i> Free Access
                </div>
            </div>

        </div>
    </div>

</body>
</html>
